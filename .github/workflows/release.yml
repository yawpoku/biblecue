name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Windows build ─────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install sounddevice numpy scipy requests python-scriptures websockets Pillow

      - name: Build backend.exe
        run: pyinstaller backend.spec

      - name: Copy backend.exe into Electron app
        run: copy dist\backend.exe biblecue-desktop\python\backend.exe

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        working-directory: biblecue-desktop
        run: npm ci

      - name: Build Windows installer
        working-directory: biblecue-desktop
        env:
          TEMP: D:\BuildTemp
          TMP: D:\BuildTemp
        run: |
          New-Item -ItemType Directory -Force D:\BuildTemp | Out-Null
          npm run build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: biblecue-desktop/dist/BibleCue*.exe

  # ── macOS build ───────────────────────────────────────────────────────────
  # One job per architecture: the bundled PyInstaller backend is native code,
  # so the Intel DMG must be built on an Intel runner (macos-15-intel) and the
  # Apple Silicon DMG on an arm64 runner (macos-15). Building both arches on
  # one runner ships a backend that only runs on that runner's CPU.
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install sounddevice numpy scipy requests python-scriptures websockets Pillow

      - name: Build backend (${{ matrix.arch }})
        run: pyinstaller backend.spec

      - name: Verify backend architecture
        run: |
          file dist/backend
          lipo -archs dist/backend || true

      - name: Copy backend into Electron app
        run: cp dist/backend biblecue-desktop/python/backend && chmod +x biblecue-desktop/python/backend

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        working-directory: biblecue-desktop
        run: npm ci

      - name: Build macOS DMG (${{ matrix.arch }})
        working-directory: biblecue-desktop
        run: npm run build:mac:${{ matrix.arch }}

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg-${{ matrix.arch }}
          path: biblecue-desktop/dist/BibleCue*.dmg

  # ── Create GitHub Release with both artifacts ─────────────────────────────
  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the GitHub Release and upload assets
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BibleCue ${{ github.ref_name }}
          body: |
            ## BibleCue ${{ github.ref_name }}

            Real-time Bible verse display for church services.

            ### Install
            | Platform | Download |
            |----------|---------|
            | **Windows** | `BibleCue.Setup.*.exe` — run the installer, no setup needed |
            | **macOS (Apple Silicon — M1/M2/M3…)** | `BibleCue-*-arm64.dmg` |
            | **macOS (Intel)** | `BibleCue-*-x64.dmg` |

            No Python or technical setup required — everything is bundled.

            **macOS first launch:** the app isn't signed with an Apple Developer ID.
            Right-click **BibleCue** in Applications → **Open** → **Open**. If macOS
            still refuses, run once in Terminal:
            `xattr -dr com.apple.quarantine /Applications/BibleCue.app`
            For Google Speech mode, set Chrome or Edge as your default browser.

            ### Features
            - Automatic scripture detection from spoken speech
            - ProPresenter 7+ integration (HTTP API)
            - Google Speech and Deepgram transcription modes
            - Offline verse lookup (KJV, WEB, ASV, BBE, YLT, DARBY)
          files: artifacts/*
          draft: false
          prerelease: false
