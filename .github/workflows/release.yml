name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Windows build ─────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install sounddevice numpy scipy requests python-scriptures websockets Pillow obs-websocket-py

      - name: Install ndi-python (optional — NDI output degrades gracefully if unavailable)
        run: pip install ndi-python
        continue-on-error: true

      - name: Build backend.exe
        run: pyinstaller backend.spec

      - name: Copy backend.exe into Electron app
        run: copy dist\backend.exe biblecue-desktop\python\backend.exe

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        working-directory: biblecue-desktop
        run: npm ci

      - name: Build Windows installer
        working-directory: biblecue-desktop
        env:
          TEMP: D:\BuildTemp
          TMP: D:\BuildTemp
        run: |
          New-Item -ItemType Directory -Force D:\BuildTemp | Out-Null
          npm run build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: biblecue-desktop/dist/BibleCue*.exe

  # ── macOS build ───────────────────────────────────────────────────────────
  # One job per architecture: the bundled PyInstaller backend is native code,
  # so the Intel DMG must be built on an Intel runner (macos-15-intel) and the
  # Apple Silicon DMG on an arm64 runner (macos-15). Building both arches on
  # one runner ships a backend that only runs on that runner's CPU.
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install sounddevice numpy scipy requests python-scriptures websockets Pillow obs-websocket-py

      - name: Install ndi-python (optional — no macOS x64 wheel exists yet; NDI
          output degrades gracefully if unavailable)
        run: pip install ndi-python
        continue-on-error: true

      - name: Build backend (${{ matrix.arch }})
        run: pyinstaller backend.spec

      - name: Verify backend architecture
        run: |
          file dist/backend
          lipo -archs dist/backend || true

      - name: Copy backend into Electron app
        run: cp dist/backend biblecue-desktop/python/backend && chmod +x biblecue-desktop/python/backend

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        working-directory: biblecue-desktop
        run: npm ci

      - name: Build macOS DMG (${{ matrix.arch }})
        working-directory: biblecue-desktop
        run: npm run build:mac:${{ matrix.arch }}

      - name: Verify DMG backend architecture
        # Guards against a repeat of the bug where the release merge shipped
        # an x64 app with an arm64 backend ("bad CPU type in executable").
        # Mounts the just-built DMG and fails the job if the bundled backend
        # doesn't match this job's target arch.
        run: |
          set -euo pipefail
          DMG=$(ls biblecue-desktop/dist/BibleCue-*-${{ matrix.arch }}.dmg)
          MOUNT_POINT=$(hdiutil attach "$DMG" -nobrowse -readonly | grep -Eo '/Volumes/.*' | tail -1)
          BACKEND="$MOUNT_POINT/BibleCue.app/Contents/Resources/python/backend"
          FOUND_ARCH=$(lipo -archs "$BACKEND")
          hdiutil detach "$MOUNT_POINT" -quiet
          echo "DMG=$DMG  backend arch=$FOUND_ARCH  expected=${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}"
          EXPECTED="${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}"
          if [ "$FOUND_ARCH" != "$EXPECTED" ]; then
            echo "::error::$DMG bundles a $FOUND_ARCH backend, expected $EXPECTED"
            exit 1
          fi

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg-${{ matrix.arch }}
          path: biblecue-desktop/dist/BibleCue-*-${{ matrix.arch }}.dmg
          if-no-files-found: error

  # ── Create GitHub Release with both artifacts ─────────────────────────────
  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the GitHub Release and upload assets
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BibleCue ${{ github.ref_name }}
          body: |
            ## BibleCue ${{ github.ref_name }}

            Real-time Bible verse display for church services.

            ### Install
            | Platform | Download |
            |----------|---------|
            | **Windows** | `BibleCue.Setup.*.exe` — run the installer, no setup needed |
            | **macOS (Apple Silicon — M1/M2/M3…)** | `BibleCue-*-arm64.dmg` |
            | **macOS (Intel)** | `BibleCue-*-x64.dmg` |

            No Python or technical setup required — everything is bundled.

            **macOS first launch:** the app isn't signed with an Apple Developer ID.
            Drag it to Applications, try to open it once, then **System Settings →
            Privacy & Security → Open Anyway** (older macOS: right-click → Open).
            The app clears the quarantine flag from its backend itself; if it still
            won't connect, run once in Terminal:
            `xattr -dr com.apple.quarantine /Applications/BibleCue.app`
            For Google Speech mode, set Chrome or Edge as your default browser.

            ### Features
            - Automatic scripture detection from spoken speech
            - ProPresenter 7+ integration (HTTP API)
            - Google Speech and Deepgram transcription modes
            - Offline verse lookup (KJV, WEB, ASV, BBE, YLT, DARBY)
          files: artifacts/*
          draft: false
          prerelease: false
