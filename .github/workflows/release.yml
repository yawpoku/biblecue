name: Build & Release

on:
  push:
    tags:
      - 'v*'          # triggers on v1.2.0, v1.2.1, etc.

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install faster-whisper sounddevice numpy scipy requests python-scriptures websockets Pillow

      - name: Build backend.exe
        run: pyinstaller backend.spec

      - name: Copy backend.exe into Electron app
        run: copy dist\backend.exe biblecue-desktop\python\backend.exe

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        working-directory: biblecue-desktop
        run: npm ci

      - name: Build Windows installer
        working-directory: biblecue-desktop
        run: npm run build

      - name: Get version from tag
        id: version
        run: echo "VERSION=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BibleCue ${{ steps.version.outputs.VERSION }}
          body: |
            ## BibleCue ${{ steps.version.outputs.VERSION }}

            Real-time Bible verse display for church services.

            ### Install
            Download **BibleCue-Setup.exe** below and run it.
            No Python or technical setup required — everything is bundled.

            ### What's included
            - Automatic scripture detection from spoken speech
            - ProPresenter 7+ integration
            - Google Speech, Deepgram, and Whisper transcription modes
            - Offline verse lookup (KJV, WEB, ASV, BBE, YLT, DARBY)
          files: |
            biblecue-desktop/dist/BibleCue*.exe
          draft: false
          prerelease: false
